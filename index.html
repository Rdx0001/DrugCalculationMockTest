<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NORCET & RRB - Drug Calculation Master Mock Test (100 Questions)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        body { background-color: #090d16; color: #f1f5f9; display: flex; justify-content: center; line-height: 1.6; padding: 15px; }
        .container { max-width: 1000px; width: 100%; }
        
        /* HEADER */
        .header { background: #131c2e; padding: 25px 20px; border-radius: 14px; box-shadow: 0 10px 30px rgba(14, 165, 233, 0.15); margin-bottom: 20px; text-align: center; border-top: 5px solid #0284c7; border-bottom: 1px solid #1e293b; }
        .header h1 { font-size: 1.8em; color: #38bdf8; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; margin-bottom: 6px; }
        .header p { color: #94a3b8; font-size: 0.95em; font-weight: 500; }
        
        /* DASHBOARD */
        .dashboard { display: flex; justify-content: space-between; margin-top: 15px; padding-top: 15px; border-top: 1px solid #1e293b; font-weight: 700; font-size: 1.1em; color: #cbd5e1; align-items: center; }
        .score-box { color: #38bdf8; background: rgba(56, 189, 248, 0.1); padding: 6px 15px; border-radius: 8px; border: 1px solid rgba(56, 189, 248, 0.25); font-family: 'JetBrains Mono', monospace; }
        
        /* PROGRESS BAR */
        .progress-bar { width: 100%; background: #1e293b; height: 10px; border-radius: 5px; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #0284c7, #38bdf8); width: 0%; transition: width 0.3s ease; }
        
        /* QUESTION BOX */
        .question-container { background: #131c2e; padding: 25px 20px; border-radius: 14px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); display: none; margin-bottom: 20px; border: 1px solid #1e293b; }
        .question-container.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .subject-tag { display: inline-block; padding: 4px 12px; background: #0b1120; color: #38bdf8; font-size: 0.75em; border-radius: 20px; margin-bottom: 15px; font-weight: 700; border: 1px solid #0284c7; text-transform: uppercase; letter-spacing: 0.8px; }
        .q-text { font-size: 1.15em; font-weight: 600; margin-bottom: 20px; color: #f8fafc; line-height: 1.6; }
        
        /* OPTIONS */
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: #0b1120; border: 2px solid #1e293b; padding: 15px 18px; border-radius: 10px; text-align: left; font-size: 1em; cursor: pointer; transition: all 0.2s; color: #cbd5e1; font-weight: 500; line-height: 1.4; display: flex; align-items: center; }
        
        @media (hover: hover) {
            .option-btn:hover:not(.disabled) { background: #1e293b; border-color: #38bdf8; transform: translateX(4px); }
            .nav-btn:hover:not(:disabled) { background: #0369a1; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); }
        }

        .option-btn.correct { background: #064e3b; border-color: #10b981; color: #a7f3d0; font-weight: 700; }
        .option-btn.incorrect { background: #7f1d1d; border-color: #ef4444; color: #fecaca; }
        .option-btn.disabled { pointer-events: none; }
        
        /* RATIONALE */
        .rationale { margin-top: 20px; padding: 18px; background: rgba(2, 132, 199, 0.08); border-left: 5px solid #0284c7; border-radius: 0 10px 10px 0; display: none; font-size: 0.95em; color: #e0f2fe; animation: fadeIn 0.4s; line-height: 1.6; border-top: 1px solid rgba(2, 132, 199, 0.2); border-right: 1px solid rgba(2, 132, 199, 0.2); border-bottom: 1px solid rgba(2, 132, 199, 0.2); font-family: 'JetBrains Mono', monospace; }
        .rationale strong { color: #38bdf8; font-size: 1.05em; display: block; margin-bottom: 8px; border-bottom: 1px solid rgba(2, 132, 199, 0.3); padding-bottom: 4px; font-family: 'Plus Jakarta Sans', sans-serif; }

        /* NAVIGATION BUTTONS */
        .navigation { display: flex; justify-content: space-between; margin-top: 25px; gap: 12px; }
        .nav-btn { flex: 1; background: #0284c7; color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 1em; cursor: pointer; transition: 0.2s; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; text-align: center; }
        .nav-btn:disabled { background: #1e293b; cursor: not-allowed; color: #64748b; }
        
        /* RESULTS */
        #results-screen { display: none; background: #131c2e; padding: 40px 20px; border-radius: 14px; text-align: center; border: 1px solid #1e293b; box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
        .final-score { font-size: 3.8em; color: #38bdf8; font-weight: 800; margin: 20px 0; font-family: 'JetBrains Mono', monospace; }

        /* MOBILE OPTIMIZATION */
        @media (max-width: 600px) {
            body { padding: 8px; }
            .header { padding: 20px 12px; }
            .header h1 { font-size: 1.4em; }
            .header p { font-size: 0.85em; }
            .dashboard { font-size: 0.95em; flex-direction: column; gap: 8px; text-align: center; }
            .question-container { padding: 18px 14px; }
            .q-text { font-size: 1.05em; }
            .option-btn { padding: 12px 14px; font-size: 0.9em; }
            .rationale { padding: 12px; font-size: 0.85em; }
            .navigation { flex-direction: column-reverse; }
            .nav-btn { width: 100%; padding: 12px; font-size: 0.95em; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Drug Calculation Simulator</h1>
        <p>100 High-Yield Clinical Calculation Questions | NORCET & RRB Pattern</p>
        <div class="dashboard">
            <span id="q-counter">Question: 1 / 100</span>
            <span class="score-box">Score: <span id="score">0.00</span> / 100</span>
        </div>
    </div>
    
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div id="quiz-body"></div>

    <div id="results-screen">
        <h2>Exam Completed</h2>
        <div class="final-score" id="final-score-display">0.00 / 100</div>
        <p style="color:#94a3b8; margin-bottom: 25px;">Detailed breakdown recorded. Review your formulas and practice high-frequency titrations.</p>
        <button class="nav-btn" onclick="location.reload()">Reattempt Test</button>
    </div>
</div>

<script>
const questions = [
    { q: "A provider orders a Dopamine infusion at 5 mcg/kg/min for an adult patient in cardiogenic shock weighing 80 kg. The pharmacy supplies Dopamine 400 mg in 250 mL D5W. At what rate in mL/hr should the IV infusion pump be programmed?", o: ["12 mL/hr", "15 mL/hr", "20 mL/hr", "25 mL/hr"], a: 1, t: "Vasopressor Titration", e: "1) Desired dose per minute = 5 mcg × 80 kg = 400 mcg/min.\n2) Dose per hour = 400 mcg/min × 60 min = 24,000 mcg/hr = 24 mg/hr.\n3) Concentration = 400 mg / 250 mL = 1.6 mg/mL.\n4) Infusion rate = 24 mg/hr ÷ 1.6 mg/mL = 15 mL/hr." },
    { q: "A patient with septic shock weighing 70 kg is prescribed Norepinephrine at 0.1 mcg/kg/min. The solution is prepared with 4 mg of Norepinephrine in 250 mL D5W. Calculate the infusion rate in mL/hr.", o: ["26.3 mL/hr", "15.5 mL/hr", "32.4 mL/hr", "42.0 mL/hr"], a: 0, t: "Vasopressor Titration", e: "1) Total mcg/min = 0.1 mcg × 70 kg = 7 mcg/min.\n2) Hourly dose = 7 mcg/min × 60 min = 420 mcg/hr.\n3) Concentration = 4 mg = 4,000 mcg in 250 mL = 16 mcg/mL.\n4) Rate = 420 mcg/hr ÷ 16 mcg/mL = 26.25 mL/hr ≈ 26.3 mL/hr." },
    { q: "An adult patient weighing 60 kg who sustained 45% TBSA partial- and full-thickness burns is admitted to the burn ICU. Using the Parkland formula (4 mL/kg/% TBSA), calculate the hourly IV infusion rate of Lactated Ringer's for the FIRST 8 hours post-injury.", o: ["675 mL/hr", "1350 mL/hr", "506 mL/hr", "844 mL/hr"], a: 0, t: "Burn Fluid Resuscitation", e: "1) Total 24-hr fluid = 4 mL × 60 kg × 45 = 10,800 mL.\n2) Volume in first 8 hours = 10,800 mL / 2 = 5,400 mL.\n3) Hourly rate for first 8 hours = 5,400 mL ÷ 8 hr = 675 mL/hr." },
    { q: "A physician orders an IV bolus of Heparin at 80 units/kg for a patient with an acute pulmonary embolism who weighs 85 kg. The vial concentration is 10,000 units/mL. How many milliliters of heparin should the nurse administer?", o: ["0.68 mL", "0.85 mL", "1.20 mL", "6.80 mL"], a: 0, t: "Anticoagulant Dosing", e: "1) Total required dose = 80 units/kg × 85 kg = 6,800 units.\n2) Available concentration = 10,000 units/mL.\n3) Volume = 6,800 units ÷ 10,000 units/mL = 0.68 mL." },
    { q: "A patient with severe heart failure is prescribed Dobutamine at 7.5 mcg/kg/min. The patient weighs 60 kg. The pharmacy provides Dobutamine 250 mg in 500 mL D5W. What is the correct infusion rate in mL/hr?", o: ["36 mL/hr", "45 mL/hr", "54 mL/hr", "60 mL/hr"], a: 2, t: "Inotrope Titration", e: "1) Desired dose per min = 7.5 mcg × 60 kg = 450 mcg/min.\n2) Desired dose per hr = 450 mcg/min × 60 min = 27,000 mcg/hr = 27 mg/hr.\n3) Concentration = 250 mg / 500 mL = 0.5 mg/mL.\n4) Rate = 27 mg/hr ÷ 0.5 mg/mL = 54 mL/hr." },
    { q: "A prescription orders 1,000 mL of 0.9% Normal Saline to be infused intravenously over 8 hours. The drop factor of the manual administration set is 15 gtt/mL. What is the required flow rate in drops per minute (gtt/min)?", o: ["28 gtt/min", "31 gtt/min", "42 gtt/min", "52 gtt/min"], a: 1, t: "IV Drop Rate Calculation", e: "1) Total volume = 1,000 mL; Total time = 8 hr × 60 min = 480 min.\n2) Formula: (Volume in mL × Drop factor) / Time in minutes.\n3) Flow rate = (1,000 × 15) / 480 = 15,000 / 480 = 31.25 ≈ 31 gtt/min." },
    { q: "A child weighing 16 kg is prescribed Amoxicillin 40 mg/kg/day divided into 2 equal doses every 12 hours. The oral suspension is supplied as 250 mg/5 mL. How many milliliters should the nurse administer per single dose?", o: ["3.2 mL", "6.4 mL", "12.8 mL", "5.0 mL"], a: 1, t: "Pediatric Dosage", e: "1) Total daily dose = 40 mg/kg/day × 16 kg = 640 mg/day.\n2) Dose per administration = 640 mg ÷ 2 doses = 320 mg/dose.\n3) Volume per dose = (320 mg ÷ 250 mg) × 5 mL = 6.4 mL." },
    { q: "A patient with hypertensive crisis is receiving Sodium Nitroprusside at 2 mcg/kg/min. The patient weighs 75 kg. The infusion bag contains 50 mg of Nitroprusside in 250 mL D5W. Calculate the infusion rate in mL/hr.", o: ["45 mL/hr", "30 mL/hr", "60 mL/hr", "15 mL/hr"], a: 0, t: "Vasodilator Titration", e: "1) Required mcg/min = 2 mcg × 75 kg = 150 mcg/min.\n2) Required mcg/hr = 150 mcg/min × 60 min = 9,000 mcg/hr = 9 mg/hr.\n3) Concentration = 50 mg / 250 mL = 0.2 mg/mL.\n4) Flow rate = 9 mg/hr ÷ 0.2 mg/mL = 45 mL/hr." },
    { q: "A 500 mg vial of powdered Ceftriaxone requires reconstitution. The label indicates adding 1.8 mL of sterile water yields a total volume of 2.0 mL with a concentration of 250 mg/mL. What is the exact powder displacement volume?", o: ["0.1 mL", "0.2 mL", "0.4 mL", "0.5 mL"], a: 1, t: "Reconstitution / Displacement", e: "Displacement volume = Total reconstituted volume - Added diluent volume = 2.0 mL - 1.8 mL = 0.2 mL." },
    { q: "An IV infusion of Regular Insulin is ordered at 0.1 units/kg/hr for a patient in DKA weighing 90 kg. The standard bag contains 100 units of Regular Insulin in 100 mL of 0.9% Normal Saline. At what rate in mL/hr should the IV pump be set?", o: ["9 mL/hr", "10 mL/hr", "18 mL/hr", "90 mL/hr"], a: 0, t: "Insulin Infusion", e: "1) Units per hour = 0.1 units × 90 kg = 9 units/hr.\n2) Concentration = 100 units / 100 mL = 1 unit/mL.\n3) Pump rate = 9 units/hr ÷ 1 unit/mL = 9 mL/hr." },
    { q: "A continuous IV infusion of Nitroglycerin is ordered at 35 mcg/min. The IV solution contains 50 mg of Nitroglycerin in 250 mL D5W. What is the infusion rate in mL/hr?", o: ["8.5 mL/hr", "10.5 mL/hr", "12.0 mL/hr", "14.5 mL/hr"], a: 1, t: "Vasodilator Titration", e: "1) Desired dose per hour = 35 mcg/min × 60 min = 2,100 mcg/hr = 2.1 mg/hr.\n2) Concentration = 50 mg / 250 mL = 0.2 mg/mL.\n3) Rate = 2.1 mg/hr ÷ 0.2 mg/mL = 10.5 mL/hr." },
    { q: "A provider orders 1 gram of Vancomycin in 200 mL of D5W to be infused over 90 minutes. What is the correct IV pump rate in mL/hr?", o: ["100 mL/hr", "133 mL/hr", "150 mL/hr", "200 mL/hr"], a: 1, t: "IV Pump Rate", e: "1) Time in hours = 90 min / 60 min = 1.5 hr.\n2) Rate in mL/hr = Total volume / Time in hours = 200 mL ÷ 1.5 hr = 133.33 ≈ 133 mL/hr." },
    { q: "A patient with status epilepticus weighing 50 kg is ordered Phenytoin 15 mg/kg IV loading dose at an infusion rate of 25 mg/min. How many minutes will it take to complete the infusion?", o: ["20 minutes", "30 minutes", "40 minutes", "50 minutes"], a: 1, t: "Critical Care Admin", e: "1) Total loading dose = 15 mg/kg × 50 kg = 750 mg.\n2) Infusion time = Total dose / Rate per minute = 750 mg ÷ 25 mg/min = 30 minutes." },
    { q: "A prescription states: Digoxin 125 mcg IV daily. The ampoule on hand contains Digoxin 0.5 mg in 2 mL. How many milliliters should the nurse administer?", o: ["0.25 mL", "0.5 mL", "1.0 mL", "1.5 mL"], a: 1, t: "Parenteral Injection", e: "1) Convert ordered dose to mg: 125 mcg = 0.125 mg.\n2) Concentration = 0.5 mg in 2 mL = 0.25 mg/mL.\n3) Volume to administer = 0.125 mg ÷ 0.25 mg/mL = 0.5 mL." },
    { q: "A patient weighing 70 kg is on a continuous Heparin infusion running at 18 units/kg/hr. The IV bag contains 25,000 units of Heparin in 500 mL of 0.9% Normal Saline. What is the current IV pump rate in mL/hr?", o: ["18.5 mL/hr", "25.2 mL/hr", "28.0 mL/hr", "32.4 mL/hr"], a: 1, t: "Anticoagulant Dosing", e: "1) Desired units/hr = 18 units × 70 kg = 1,260 units/hr.\n2) Concentration = 25,000 units / 500 mL = 50 units/mL.\n3) Rate = 1,260 units/hr ÷ 50 units/mL = 25.2 mL/hr." },
    { q: "A pediatric patient requires 500 mL of D5 0.45% NS over 10 hours using a microdrip administration set (60 gtt/mL). Calculate the drops per minute.", o: ["30 gtt/min", "40 gtt/min", "50 gtt/min", "60 gtt/min"], a: 2, t: "Microdrip Calculation", e: "Formula: (Volume in mL × Drop factor) / Time in minutes.\nTime = 10 hr × 60 min = 600 min.\nRate = (500 mL × 60 gtt/mL) / 600 min = 30,000 / 600 = 50 gtt/min." },
    { q: "A patient with cerebral edema is prescribed Mannitol 20% at a dose of 1 g/kg IV over 60 minutes. The patient weighs 75 kg. How many milliliters of the 20% Mannitol solution should be infused?", o: ["150 mL", "300 mL", "375 mL", "750 mL"], a: 2, t: "Percent Solution", e: "1) Total dose = 1 g/kg × 75 kg = 75 grams.\n2) 20% solution means 20 grams per 100 mL (0.2 g/mL).\n3) Volume = 75 g ÷ 0.2 g/mL = 375 mL." },
    { q: "A provider prescribes Potassium Chloride 40 mEq in 1,000 mL D5W to be infused at a safe rate of 10 mEq/hr. What should be the hourly rate on the infusion pump?", o: ["100 mL/hr", "150 mL/hr", "200 mL/hr", "250 mL/hr"], a: 3, t: "Electrolyte Infusion", e: "1) Concentration = 40 mEq / 1,000 mL = 0.04 mEq/mL.\n2) Infusion rate = 10 mEq/hr ÷ 0.04 mEq/mL = 250 mL/hr." },
    { q: "A physician orders Midazolam 0.05 mg/kg IV push pre-procedure for a patient weighing 80 kg. The available concentration is 5 mg/mL. How many milliliters should the nurse prepare?", o: ["0.4 mL", "0.8 mL", "1.2 mL", "1.6 mL"], a: 1, t: "Sedative Dosing", e: "1) Total dose = 0.05 mg/kg × 80 kg = 4 mg.\n2) Available concentration = 5 mg/mL.\n3) Volume = 4 mg ÷ 5 mg/mL = 0.8 mL." },
    { q: "A 5-year-old child with a BSA of 0.8 m² is prescribed Methotrexate 15 mg/m² weekly. What is the calculated weekly dose?", o: ["10 mg", "12 mg", "15 mg", "18.75 mg"], a: 1, t: "BSA-Based Chemotherapy", e: "Dose = Prescribed dose/m² × BSA = 15 mg/m² × 0.8 m² = 12 mg." },
    { q: "An infusion of 2 units of Packed Red Blood Cells (each unit = 250 mL) is ordered to run sequentially, each over 3 hours. What is the hourly infusion pump rate for each unit?", o: ["62.5 mL/hr", "83.3 mL/hr", "125 mL/hr", "166.7 mL/hr"], a: 1, t: "Blood Transfusion", e: "Rate per single unit = 250 mL ÷ 3 hr = 83.33 ≈ 83.3 mL/hr." },
    { q: "A patient with refractory V-Tach is receiving an Amiodarone maintenance infusion at 0.5 mg/min. The solution is mixed as 900 mg of Amiodarone in 500 mL D5W. What is the pump rate in mL/hr?", o: ["16.7 mL/hr", "33.3 mL/hr", "25.0 mL/hr", "50.0 mL/hr"], a: 0, t: "Antiarrhythmic Drips", e: "1) Hourly dose = 0.5 mg/min × 60 min = 30 mg/hr.\n2) Concentration = 900 mg / 500 mL = 1.8 mg/mL.\n3) Infusion rate = 30 mg/hr ÷ 1.8 mg/mL = 16.66 ≈ 16.7 mL/hr." },
    { q: "The order reads: Fentanyl 1.5 mcg/kg IV push. The patient weighs 65 kg. The vial concentration is 50 mcg/mL. How many milliliters should be administered?", o: ["0.98 mL", "1.95 mL", "2.15 mL", "3.25 mL"], a: 1, t: "Opioid Injection", e: "1) Dose in mcg = 1.5 mcg/kg × 65 kg = 97.5 mcg.\n2) Volume = 97.5 mcg ÷ 50 mcg/mL = 1.95 mL." },
    { q: "A client with severe eclampsia is ordered Magnesium Sulfate 4 g IV loading dose over 20 minutes. The pharmacy supplies Magnesium Sulfate 50% solution in 10 mL ampoules (5 g/10 mL), which is diluted into 100 mL D5W. At what rate in mL/hr should the infusion pump be programmed?", o: ["100 mL/hr", "200 mL/hr", "300 mL/hr", "400 mL/hr"], a: 2, t: "Critical Care Admin", e: "1) Total infusion volume = 100 mL.\n2) Time in hours = 20 min / 60 min = 1/3 hr = 0.333 hr.\n3) Flow rate = 100 mL ÷ (1/3 hr) = 300 mL/hr." },
    { q: "The order is for Gentamicin 120 mg IV piggyback in 100 mL of Normal Saline over 45 minutes. What is the rate in mL/hr?", o: ["100 mL/hr", "120 mL/hr", "133 mL/hr", "150 mL/hr"], a: 2, t: "IV Piggyback Rate", e: "1) Time in hours = 45 min / 60 min = 0.75 hr.\n2) Rate = 100 mL ÷ 0.75 hr = 133.33 ≈ 133 mL/hr." },
    { q: "A child weighing 22 lb is prescribed Cefaclor 20 mg/kg/day in 3 divided doses. The suspension is labeled 125 mg/5 mL. How many mL per dose?", o: ["2.7 mL", "4.0 mL", "5.3 mL", "8.0 mL"], a: 0, t: "Pediatric Calculation", e: "1) Weight in kg = 22 lb ÷ 2.2 = 10 kg.\n2) Total daily dose = 20 mg × 10 kg = 200 mg/day.\n3) Dose per administration = 200 mg ÷ 3 = 66.67 mg.\n4) Volume = (66.67 mg ÷ 125 mg) × 5 mL = 2.67 ≈ 2.7 mL." },
    { q: "An IV bag of 1,000 mL 0.45% NaCl was started at 0800 at a rate of 125 mL/hr. At 1200, the physician increases the rate to 150 mL/hr. At what time will the bag be completely empty?", o: ["1440", "1520", "1545", "1620"], a: 1, t: "Infusion Timing", e: "1) Volume infused 0800 to 1200 (4 hours) = 4 hr × 125 mL/hr = 500 mL.\n2) Remaining volume = 1,000 mL - 500 mL = 500 mL.\n3) Time remaining at 150 mL/hr = 500 mL ÷ 150 mL/hr = 3.33 hr = 3 hours and 20 minutes.\n4) 1200 + 3 hr 20 min = 1520." },
    { q: "The physician orders Morphine Sulfate 4 mg IV push. The medication is supplied in a prefilled cartridge labeled 10 mg/mL. How many mL should the nurse administer?", o: ["0.2 mL", "0.4 mL", "0.6 mL", "0.8 mL"], a: 1, t: "Parenteral Injection", e: "Volume = Desired / Available = 4 mg ÷ 10 mg/mL = 0.4 mL." },
    { q: "A patient with septic shock is receiving Vasopressin at 0.03 units/min. The solution is 20 units of Vasopressin in 100 mL 0.9% Normal Saline. What is the pump rate in mL/hr?", o: ["4.5 mL/hr", "6.0 mL/hr", "9.0 mL/hr", "12.0 mL/hr"], a: 2, t: "Vasopressor Titration", e: "1) Dose per hour = 0.03 units/min × 60 min = 1.8 units/hr.\n2) Concentration = 20 units / 100 mL = 0.2 units/mL.\n3) Rate = 1.8 units/hr ÷ 0.2 units/mL = 9.0 mL/hr." },
    { q: "How many milliequivalents (mEq) of Sodium are contained in 500 mL of 3% Hypertonic Saline? (Molar mass of NaCl = 58.5 g/mol).", o: ["128 mEq", "256 mEq", "513 mEq", "1026 mEq"], a: 1, t: "Electrolyte Molar Concentration", e: "1) 3% NaCl = 3 g/100 mL = 15 g in 500 mL.\n2) 15 g = 15,000 mg.\n3) mEq = mg / molar mass = 15,000 / 58.5 = 256.4 mEq of Na+." },
    { q: "A patient is to receive Ciprofloxacin 400 mg IV in 200 mL D5W over 60 minutes. The nurse uses an IV infusion set with a drop factor of 20 gtt/mL. What is the drip rate in gtt/min?", o: ["33 gtt/min", "50 gtt/min", "67 gtt/min", "100 gtt/min"], a: 2, t: "IV Drop Rate Calculation", e: "Drip rate = (Total volume in mL × Drop factor) / Time in minutes = (200 × 20) / 60 = 4,000 / 60 = 66.67 ≈ 67 gtt/min." },
    { q: "The provider orders an Epinephrine infusion at 0.05 mcg/kg/min for a pediatric patient weighing 20 kg. The pharmacy sends Epinephrine 1 mg in 250 mL D5W. What is the rate in mL/hr?", o: ["7.5 mL/hr", "12.0 mL/hr", "15.0 mL/hr", "18.5 mL/hr"], a: 2, t: "Pediatric Critical Care", e: "1) Desired dose per min = 0.05 mcg × 20 kg = 1 mcg/min.\n2) Desired dose per hr = 1 mcg/min × 60 min = 60 mcg/hr.\n3) Concentration = 1 mg = 1,000 mcg in 250 mL = 4 mcg/mL.\n4) Rate = 60 mcg/hr ÷ 4 mcg/mL = 15.0 mL/hr." },
    { q: "A client weighing 176 lb requires an IV infusion of Diltiazem at 10 mg/hr. The solution concentration is 125 mg in 100 mL D5W. Calculate the flow rate in mL/hr.", o: ["8 mL/hr", "10 mL/hr", "12 mL/hr", "16 mL/hr"], a: 0, t: "Cardiac Infusion", e: "1) Concentration = 125 mg / 100 mL = 1.25 mg/mL.\n2) Ordered dose = 10 mg/hr.\n3) Infusion rate = 10 mg/hr ÷ 1.25 mg/mL = 8 mL/hr. (Note: Patient weight is extra information because the order is in mg/hr, not mg/kg/hr)." },
    { q: "A physician prescribes Enoxaparin 1 mg/kg subcutaneously every 12 hours. The patient weighs 143 lb. Available is an Enoxaparin prefilled syringe labeled 80 mg/0.8 mL. How many mL will the nurse administer?", o: ["0.60 mL", "0.65 mL", "0.70 mL", "0.75 mL"], a: 1, t: "Anticoagulant Dosing", e: "1) Weight = 143 lb ÷ 2.2 = 65 kg.\n2) Dose = 1 mg/kg × 65 kg = 65 mg.\n3) Syringe concentration = 80 mg / 0.8 mL = 100 mg/mL.\n4) Volume = 65 mg ÷ 100 mg/mL = 0.65 mL." },
    { q: "An adult receives an infusion of 100 mL containing 2 g of Cefazolin over 30 minutes via gravity drip with a 10 gtt/mL administration set. What is the flow rate?", o: ["25 gtt/min", "33 gtt/min", "40 gtt/min", "50 gtt/min"], a: 1, t: "IV Drop Rate Calculation", e: "Rate = (100 mL × 10 gtt/mL) / 30 min = 1,000 / 30 = 33.33 ≈ 33 gtt/min." },
    { q: "A patient with status asthmaticus is ordered Aminophylline 0.5 mg/kg/hr. The patient weighs 60 kg. The IV bag contains 500 mg Aminophylline in 500 mL D5W. What is the infusion rate in mL/hr?", o: ["15 mL/hr", "30 mL/hr", "45 mL/hr", "60 mL/hr"], a: 1, t: "Respiratory Infusion", e: "1) Dose per hr = 0.5 mg × 60 kg = 30 mg/hr.\n2) Concentration = 500 mg / 500 mL = 1 mg/mL.\n3) Rate = 30 mg/hr ÷ 1 mg/mL = 30 mL/hr." },
    { q: "How many grams of Dextrose are present in 1 liter of D10W (10% Dextrose in Water)?", o: ["10 g", "50 g", "100 g", "200 g"], a: 2, t: "Percent Solution", e: "10% solution means 10 g of solute per 100 mL of solution.\nIn 1,000 mL: (10 g / 100 mL) × 1,000 mL = 100 g." },
    { q: "A prescription orders Atropine 0.6 mg IM stat. Available is Atropine sulfate 0.4 mg/mL. How many milliliters should be given?", o: ["0.67 mL", "1.00 mL", "1.25 mL", "1.50 mL"], a: 3, t: "Parenteral Injection", e: "Volume = Desired / Available = 0.6 mg ÷ 0.4 mg/mL = 1.5 mL." },
    { q: "A patient in hypovolemic shock is prescribed a 500 mL bolus of 0.9% Normal Saline over 20 minutes. What rate should be set on the volumetric infusion pump in mL/hr?", o: ["1,000 mL/hr", "1,200 mL/hr", "1,500 mL/hr", "1,800 mL/hr"], a: 2, t: "IV Pump Rate", e: "1) Time in hours = 20 min / 60 min = 1/3 hr.\n2) Rate = 500 mL ÷ (1/3 hr) = 1,500 mL/hr." },
    { q: "A patient with Addisonian crisis is prescribed Hydrocortisone 100 mg IV every 8 hours. Available is a powder vial labeled 250 mg. Reconstitution instructions state: add 1.8 mL sterile water to yield a concentration of 125 mg/mL. What volume should be injected?", o: ["0.4 mL", "0.8 mL", "1.2 mL", "1.6 mL"], a: 1, t: "Reconstitution", e: "Volume = Desired / Concentration = 100 mg ÷ 125 mg/mL = 0.8 mL." },
    { q: "A physician orders an infusion of Cisatracurium at 3 mcg/kg/min for a mechanically ventilated patient weighing 80 kg. The drug is mixed as 100 mg in 250 mL D5W. Find the rate in mL/hr.", o: ["24 mL/hr", "36 mL/hr", "42 mL/hr", "50 mL/hr"], a: 1, t: "Paralytic Infusion", e: "1) Dose per min = 3 mcg × 80 kg = 240 mcg/min.\n2) Dose per hr = 240 mcg/min × 60 min = 14,400 mcg/hr = 14.4 mg/hr.\n3) Concentration = 100 mg / 250 mL = 0.4 mg/mL.\n4) Rate = 14.4 mg/hr ÷ 0.4 mg/mL = 36 mL/hr." },
    { q: "The order is for Haloperidol 2.5 mg IM. The ampoule contains 5 mg/mL. How many mL will the nurse administer?", o: ["0.25 mL", "0.5 mL", "0.75 mL", "1.0 mL"], a: 1, t: "Psychiatric Dosing", e: "Volume = 2.5 mg ÷ 5 mg/mL = 0.5 mL." },
    { q: "A patient weighing 75 kg with severe sepsis has an order to receive 30 mL/kg of crystalloids over 3 hours. Calculate the infusion rate in mL/hr.", o: ["500 mL/hr", "650 mL/hr", "750 mL/hr", "850 mL/hr"], a: 2, t: "Fluid Resuscitation", e: "1) Total volume = 30 mL/kg × 75 kg = 2,250 mL.\n2) Infusion rate = 2,250 mL ÷ 3 hr = 750 mL/hr." },
    { q: "A 10-year-old child weighing 30 kg is ordered Paracetamol 15 mg/kg IV every 6 hours PRN. The vial concentration is 10 mg/mL. What volume should be administered per dose?", o: ["15 mL", "30 mL", "45 mL", "60 mL"], a: 2, t: "Pediatric Dosing", e: "1) Total dose = 15 mg/kg × 30 kg = 450 mg.\n2) Volume = 450 mg ÷ 10 mg/mL = 45 mL." },
    { q: "How many milligrams of elemental iron are present in 300 mg of Ferrous Sulfate tablets? (Ferrous sulfate is 20% elemental iron).", o: ["30 mg", "60 mg", "90 mg", "120 mg"], a: 1, t: "Elemental Content", e: "Elemental iron = 300 mg × 0.20 = 60 mg." },
    { q: "A patient is ordered 250 mL of 20% Lipids to be infused over 12 hours. At what hourly rate should the pump run?", o: ["15.5 mL/hr", "20.8 mL/hr", "25.0 mL/hr", "30.2 mL/hr"], a: 1, t: "TPN Lipids", e: "Rate = 250 mL ÷ 12 hr = 20.83 ≈ 20.8 mL/hr." },
    { q: "A prescription orders Metronidazole 500 mg IV piggyback every 8 hours. Supplied is a 100 mL premixed bag to be infused over 40 minutes. Using a set with a drop factor of 15 gtt/mL, calculate the flow rate in gtt/min.", o: ["25 gtt/min", "38 gtt/min", "45 gtt/min", "50 gtt/min"], a: 1, t: "IV Drop Rate Calculation", e: "Flow rate = (100 mL × 15 gtt/mL) / 40 min = 1,500 / 40 = 37.5 ≈ 38 gtt/min." },
    { q: "An order reads: Cefotaxime 750 mg IM. The 1 g vial instructs the nurse to add 3 mL of diluent to yield 3.4 mL. What volume contains the ordered 750 mg?", o: ["2.25 mL", "2.55 mL", "2.85 mL", "3.00 mL"], a: 1, t: "Reconstitution", e: "1) Concentration = 1,000 mg / 3.4 mL = 294.12 mg/mL.\n2) Volume = 750 mg ÷ 294.12 mg/mL = 2.55 mL." },
    { q: "The provider prescribes a Lidocaine infusion at 2 mg/min. Available is 2 g of Lidocaine in 500 mL D5W. At what rate in mL/hr should the IV pump be set?", o: ["15 mL/hr", "30 mL/hr", "45 mL/hr", "60 mL/hr"], a: 1, t: "Antiarrhythmic Drips", e: "1) Hourly dose = 2 mg/min × 60 min = 120 mg/hr.\n2) Concentration = 2,000 mg / 500 mL = 4 mg/mL.\n3) Flow rate = 120 mg/hr ÷ 4 mg/mL = 30 mL/hr." },
    { q: "A 4-year-old child with meningitis weighs 18 kg and is ordered Ceftriaxone 100 mg/kg/day IV divided every 12 hours. The reconstituted concentration is 100 mg/mL. How many mL should be given per dose?", o: ["4.5 mL", "9.0 mL", "18.0 mL", "36.0 mL"], a: 1, t: "Pediatric Calculation", e: "1) Daily dose = 100 mg × 18 kg = 1,800 mg/day.\n2) Dose per 12 hours = 1,800 mg ÷ 2 = 900 mg.\n3) Volume = 900 mg ÷ 100 mg/mL = 9.0 mL." },
    { q: "A patient is to receive 1.5 million units of Penicillin G potassium IV. The vial contains 5 million units of powder. Adding 8 mL of diluent gives a total volume of 10 mL. How many mL will provide the desired dose?", o: ["1.5 mL", "2.0 mL", "3.0 mL", "4.5 mL"], a: 2, t: "Reconstitution", e: "1) Concentration = 5,000,000 units / 10 mL = 500,000 units/mL.\n2) Volume = 1,500,000 units ÷ 500,000 units/mL = 3.0 mL." },
    { q: "A physician orders Epinephrine 0.3 mg subcutaneous stat for anaphylaxis. Available is Epinephrine 1:1,000 solution. How many mL should be injected?", o: ["0.03 mL", "0.3 mL", "3.0 mL", "30.0 mL"], a: 1, t: "Ratio Solutions", e: "1:1,000 ratio means 1 g in 1,000 mL = 1 mg/mL.\nVolume = 0.3 mg ÷ 1 mg/mL = 0.3 mL." },
    { q: "A patient is ordered 25 mcg of Fentanyl IV. Available is Fentanyl 0.05 mg/mL. How many mL should the nurse draw up?", o: ["0.25 mL", "0.5 mL", "1.0 mL", "2.0 mL"], a: 1, t: "Metric Conversion", e: "1) Convert 0.05 mg to mcg: 0.05 mg × 1,000 = 50 mcg/mL.\n2) Volume = 25 mcg ÷ 50 mcg/mL = 0.5 mL." },
    { q: "A nurse is titrating a Propofol infusion for a 70 kg mechanically ventilated patient ordered at 30 mcg/kg/min. The solution is 10 mg/mL (1%). What is the pump rate in mL/hr?", o: ["8.4 mL/hr", "12.6 mL/hr", "16.8 mL/hr", "21.0 mL/hr"], a: 1, t: "Sedative Drips", e: "1) Desired dose per min = 30 mcg × 70 kg = 2,100 mcg/min.\n2) Desired dose per hr = 2,100 mcg/min × 60 min = 126,000 mcg/hr = 126 mg/hr.\n3) Concentration = 10 mg/mL.\n4) Rate = 126 mg/hr ÷ 10 mg/mL = 12.6 mL/hr." },
    { q: "The order is for Digoxin 0.25 mg PO daily. Available are 125 mcg tablets. How many tablets should be administered?", o: ["0.5 tablet", "1 tablet", "2 tablets", "3 tablets"], a: 2, t: "Oral Dosing", e: "1) Convert 0.25 mg to mcg: 0.25 × 1,000 = 250 mcg.\n2) Number of tablets = 250 mcg ÷ 125 mcg/tablet = 2 tablets." },
    { q: "An IV infusion of 500 mL D5W with 20 mEq KCl is running at 75 mL/hr. How many mEq of Potassium does the patient receive per hour?", o: ["1.5 mEq/hr", "3.0 mEq/hr", "4.5 mEq/hr", "6.0 mEq/hr"], a: 1, t: "Electrolyte Delivery Rate", e: "1) Concentration = 20 mEq / 500 mL = 0.04 mEq/mL.\n2) Delivery per hour = 0.04 mEq/mL × 75 mL/hr = 3.0 mEq/hr." },
    { q: "A child weighing 14 kg is prescribed oral Ibuprofen 10 mg/kg every 6 hours. Available is an oral liquid containing 100 mg/5 mL. What is the total daily volume of medication in mL?", o: ["14 mL", "21 mL", "28 mL", "35 mL"], a: 2, t: "Pediatric Calculation", e: "1) Dose per admin = 10 mg × 14 kg = 140 mg.\n2) Volume per admin = (140 mg ÷ 100 mg) × 5 mL = 7 mL.\n3) Daily doses (every 6 hours) = 4 doses.\n4) Total daily volume = 7 mL × 4 = 28 mL." },
    { q: "The prescription reads: Regular Insulin 14 units and NPH Insulin 28 units subcutaneously every morning. What total volume in mL will be injected using a U-100 syringe?", o: ["0.28 mL", "0.42 mL", "0.56 mL", "4.2 mL"], a: 1, t: "Insulin Measurement", e: "1) Total units = 14 + 28 = 42 units.\n2) In a U-100 syringe (100 units/mL), volume = 42 units ÷ 100 units/mL = 0.42 mL." },
    { q: "A patient receives an order for 2 liters of normal saline over 12 hours. Using a 10 gtt/mL administration set, what is the flow rate in gtt/min?", o: ["24 gtt/min", "28 gtt/min", "32 gtt/min", "36 gtt/min"], a: 1, t: "IV Drop Rate Calculation", e: "Time = 12 hr × 60 min = 720 min.\nDrop rate = (2,000 mL × 10 gtt/mL) / 720 min = 20,000 / 720 = 27.77 ≈ 28 gtt/min." },
    { q: "An IV bag containing 500 mL of fluid has an infusion rate of 40 mL/hr. How many hours will this infusion run?", o: ["10.5 hours", "12.5 hours", "14.0 hours", "15.5 hours"], a: 1, t: "Infusion Duration", e: "Duration = Total Volume / Rate = 500 mL ÷ 40 mL/hr = 12.5 hours." },
    { q: "A patient with refractory hypomagnesemia is ordered Magnesium Sulfate 2 g in 100 mL D5W IV over 1 hour. The drop factor is 15 gtt/mL. What is the drip rate?", o: ["15 gtt/min", "25 gtt/min", "35 gtt/min", "50 gtt/min"], a: 1, t: "IV Drop Rate Calculation", e: "Drip rate = (100 mL × 15 gtt/mL) / 60 min = 1,500 / 60 = 25 gtt/min." },
    { q: "The order is for Prednisone 40 mg PO daily. Available are 5 mg scored tablets. How many tablets will the nurse provide?", o: ["4 tablets", "6 tablets", "8 tablets", "10 tablets"], a: 2, t: "Oral Dosing", e: "Tablets = 40 mg ÷ 5 mg/tablet = 8 tablets." },
    { q: "A 70 kg patient in cardiogenic shock is on Epinephrine at 0.08 mcg/kg/min. The concentration is 4 mg in 250 mL D5W (16 mcg/mL). Calculate the pump rate in mL/hr.", o: ["15 mL/hr", "21 mL/hr", "28 mL/hr", "35 mL/hr"], a: 1, t: "Vasopressor Titration", e: "1) Dose per min = 0.08 mcg × 70 kg = 5.6 mcg/min.\n2) Dose per hr = 5.6 mcg/min × 60 min = 336 mcg/hr.\n3) Rate = 336 mcg/hr ÷ 16 mcg/mL = 21 mL/hr." },
    { q: "A child weighing 44 lb is ordered Ampicillin 50 mg/kg/day divided q6h. How many milligrams should the child receive per dose?", o: ["125 mg", "250 mg", "500 mg", "1,000 mg"], a: 1, t: "Pediatric Calculation", e: "1) Weight = 44 lb ÷ 2.2 = 20 kg.\n2) Daily dose = 50 mg × 20 kg = 1,000 mg/day.\n3) Dose q6h (4 doses/day) = 1,000 mg ÷ 4 = 250 mg/dose." },
    { q: "An IV of 1,000 mL D5W was started at 0700 at 83 mL/hr. How much fluid remains in the bag at 1500?", o: ["336 mL", "415 mL", "500 mL", "664 mL"], a: 0, t: "Infusion Timing", e: "1) Time elapsed (0700 to 1500) = 8 hours.\n2) Volume infused = 8 hr × 83 mL/hr = 664 mL.\n3) Remaining volume = 1,000 mL - 664 mL = 336 mL." },
    { q: "The doctor orders Heparin 5,000 units subcutaneous every 12 hours. Available is Heparin 10,000 units/mL. What volume should be injected?", o: ["0.25 mL", "0.5 mL", "0.75 mL", "1.0 mL"], a: 1, t: "Anticoagulant Dosing", e: "Volume = 5,000 units ÷ 10,000 units/mL = 0.5 mL." },
    { q: "How many milligrams of active drug are in 5 mL of a 2% Lidocaine solution?", o: ["10 mg", "50 mg", "100 mg", "200 mg"], a: 2, t: "Percent Solution", e: "2% solution = 2 g/100 mL = 2,000 mg/100 mL = 20 mg/mL.\nIn 5 mL: 20 mg/mL × 5 mL = 100 mg." },
    { q: "The prescription reads: Codeine phosphate 30 mg PO every 4 hours PRN pain. Available is Codeine syrup 15 mg per 5 mL. How many teaspoons should the patient take?", o: ["1 teaspoon", "2 teaspoons", "3 teaspoons", "4 teaspoons"], a: 1, t: "Household Measurements", e: "1) Volume in mL = (30 mg ÷ 15 mg) × 5 mL = 10 mL.\n2) 1 teaspoon (tsp) = 5 mL.\n3) Teaspoons = 10 mL ÷ 5 mL/tsp = 2 teaspoons." },
    { q: "A patient weighing 80 kg is receiving an infusion of Milrinone at 0.375 mcg/kg/min. The solution contains 40 mg of Milrinone in 200 mL D5W. Find the rate in mL/hr.", o: ["6 mL/hr", "9 mL/hr", "12 mL/hr", "18 mL/hr"], a: 1, t: "Inotrope Titration", e: "1) Dose per min = 0.375 mcg × 80 kg = 30 mcg/min.\n2) Dose per hr = 30 mcg/min × 60 min = 1,800 mcg/hr = 1.8 mg/hr.\n3) Concentration = 40 mg / 200 mL = 0.2 mg/mL.\n4) Rate = 1.8 mg/hr ÷ 0.2 mg/mL = 9 mL/hr." },
    { q: "A provider prescribes 1.2 million units of Bicillin C-R IM. The available syringe contains 600,000 units/mL. What volume is to be administered?", o: ["1.0 mL", "1.5 mL", "2.0 mL", "2.5 mL"], a: 2, t: "Parenteral Injection", e: "Volume = 1,200,000 units ÷ 600,000 units/mL = 2.0 mL." },
    { q: "An IV infusion of 1,000 mL Lactated Ringer's is ordered over 6 hours. Using a drop factor of 20 gtt/mL, what is the rate in gtt/min?", o: ["45 gtt/min", "56 gtt/min", "65 gtt/min", "72 gtt/min"], a: 1, t: "IV Drop Rate Calculation", e: "Rate = (1,000 mL × 20 gtt/mL) / (6 × 60 min) = 20,000 / 360 = 55.55 ≈ 56 gtt/min." },
    { q: "A patient is to receive 0.25 mg of Levothyroxine IV. Available is a vial containing 500 mcg of lyophilized powder. Adding 5 mL of normal saline provides a concentration of 100 mcg/mL. How many mL are needed?", o: ["1.5 mL", "2.0 mL", "2.5 mL", "3.0 mL"], a: 2, t: "Reconstitution", e: "1) Convert 0.25 mg to mcg: 0.25 × 1,000 = 250 mcg.\n2) Volume = 250 mcg ÷ 100 mcg/mL = 2.5 mL." },
    { q: "A patient with DKA is receiving an insulin drip running at 14 mL/hr. The concentration is 100 units of Regular Insulin in 100 mL Normal Saline. How many units of insulin is the patient receiving per hour?", o: ["7 units/hr", "10 units/hr", "14 units/hr", "28 units/hr"], a: 2, t: "Insulin Infusion", e: "Concentration = 100 units / 100 mL = 1 unit/mL.\nUnits per hour = 14 mL/hr × 1 unit/mL = 14 units/hr." },
    { q: "The provider orders Spironolactone 75 mg PO daily. Available are 25 mg tablets. How many tablets should be administered?", o: ["2 tablets", "2.5 tablets", "3 tablets", "4 tablets"], a: 2, t: "Oral Dosing", e: "Tablets = 75 mg ÷ 25 mg/tablet = 3 tablets." },
    { q: "A chemotherapy order specifies Cisplatin 75 mg/m² IV for a patient with a BSA of 1.65 m². What is the total dose to be administered?", o: ["115.5 mg", "123.75 mg", "135.0 mg", "142.5 mg"], a: 1, t: "BSA-Based Chemotherapy", e: "Total dose = 75 mg/m² × 1.65 m² = 123.75 mg." },
    { q: "The order is for 100 mL of 20% Albumin IV to be infused over 2 hours. What is the hourly rate on the IV pump?", o: ["25 mL/hr", "50 mL/hr", "75 mL/hr", "100 mL/hr"], a: 1, t: "Colloid Infusion", e: "Rate = 100 mL ÷ 2 hr = 50 mL/hr." },
    { q: "A child weighing 25 kg is ordered Cefazolin 25 mg/kg IV every 8 hours. Available is 500 mg in 50 mL D5W to run over 30 minutes. What is the pump rate in mL/hr?", o: ["50 mL/hr", "100 mL/hr", "125 mL/hr", "150 mL/hr"], a: 1, t: "Pediatric IV Rate", e: "The bag volume is 50 mL and must run over 30 min (0.5 hr).\nPump rate = 50 mL ÷ 0.5 hr = 100 mL/hr." },
    { q: "A prescription orders Granisetron 10 mcg/kg IV 30 minutes prior to chemotherapy. The patient weighs 65 kg. The vial contains 1 mg/mL. How many mL should be administered?", o: ["0.35 mL", "0.65 mL", "0.85 mL", "1.10 mL"], a: 1, t: "Antiemetic Dosing", e: "1) Dose = 10 mcg × 65 kg = 650 mcg = 0.65 mg.\n2) Volume = 0.65 mg ÷ 1 mg/mL = 0.65 mL." },
    { q: "How many mL of 50% Dextrose (D50W) are needed to provide 25 grams of Dextrose to a hypoglycemic patient?", o: ["25 mL", "50 mL", "75 mL", "100 mL"], a: 1, t: "Percent Solution", e: "50% Dextrose = 50 g / 100 mL = 0.5 g/mL.\nVolume = 25 g ÷ 0.5 g/mL = 50 mL." },
    { q: "The order reads: Potassium chloride 20 mEq in 250 mL NS over 2 hours. Drop factor is 10 gtt/mL. Find the flow rate in gtt/min.", o: ["15 gtt/min", "21 gtt/min", "28 gtt/min", "35 gtt/min"], a: 1, t: "IV Drop Rate Calculation", e: "Rate = (250 mL × 10 gtt/mL) / (2 × 60 min) = 2,500 / 120 = 20.83 ≈ 21 gtt/min." },
    { q: "A provider prescribes 250 mg of an antibiotic in 100 mL to be infused over 45 minutes. What is the hourly rate in mL/hr?", o: ["120 mL/hr", "133 mL/hr", "145 mL/hr", "160 mL/hr"], a: 1, t: "IV Pump Rate", e: "Rate = 100 mL ÷ (45/60 hr) = 100 ÷ 0.75 = 133.33 ≈ 133 mL/hr." },
    { q: "A patient is prescribed 0.125 mg of Digoxin PO daily. Available are 0.25 mg tablets. How many tablets will the patient receive?", o: ["0.5 tablet", "1 tablet", "1.5 tablets", "2 tablets"], a: 0, t: "Oral Dosing", e: "Tablets = 0.125 mg ÷ 0.25 mg/tablet = 0.5 tablet." },
    { q: "A client with acute hypercalcemia is ordered Calcitonin 4 units/kg subcutaneous every 12 hours. The client weighs 75 kg. Available is 200 units/mL. What volume should be injected?", o: ["0.75 mL", "1.0 mL", "1.5 mL", "2.0 mL"], a: 2, t: "Endocrine Dosing", e: "1) Total dose = 4 units × 75 kg = 300 units.\n2) Volume = 300 units ÷ 200 units/mL = 1.5 mL." },
    { q: "An IV bag of 1,000 mL Normal Saline is infusing at 35 gtt/min using a 15 gtt/mL set. How many hours will the total volume last?", o: ["5.8 hours", "7.1 hours", "8.2 hours", "9.5 hours"], a: 1, t: "Infusion Duration", e: "1) mL per minute = 35 gtt/min ÷ 15 gtt/mL = 2.333 mL/min.\n2) mL per hour = 2.333 × 60 = 140 mL/hr.\n3) Total hours = 1,000 mL ÷ 140 mL/hr = 7.14 hours." },
    { q: "The provider orders Lorazepam 2 mg IV push. Available is Lorazepam 4 mg/mL. How many mL should be administered?", o: ["0.25 mL", "0.5 mL", "0.75 mL", "1.0 mL"], a: 1, t: "Parenteral Injection", e: "Volume = 2 mg ÷ 4 mg/mL = 0.5 mL." },
    { q: "A patient with refractory hypotension is receiving Norepinephrine at 12 mL/hr. The concentration is 8 mg in 250 mL D5W (32 mcg/mL). The patient weighs 80 kg. What dose is the patient receiving in mcg/kg/min?", o: ["0.04 mcg/kg/min", "0.08 mcg/kg/min", "0.12 mcg/kg/min", "0.16 mcg/kg/min"], a: 1, t: "Titration Reverse Math", e: "1) mcg per hour = 12 mL/hr × 32 mcg/mL = 384 mcg/hr.\n2) mcg per minute = 384 mcg/hr ÷ 60 = 6.4 mcg/min.\n3) mcg/kg/min = 6.4 mcg/min ÷ 80 kg = 0.08 mcg/kg/min." },
    { q: "A 6-year-old child weighing 20 kg requires an IV infusion of maintenance fluid (4-2-1 rule). What is the calculated hourly maintenance rate?", o: ["40 mL/hr", "50 mL/hr", "60 mL/hr", "70 mL/hr"], a: 2, t: "Pediatric Maintenance Fluid", e: "Using 4-2-1 rule: First 10 kg = 10 × 4 = 40 mL/hr. Second 10 kg (11-20 kg) = 10 × 2 = 20 mL/hr. Total = 40 + 20 = 60 mL/hr." },
    { q: "A client is prescribed 1 liter of D5 0.9% NS over 8 hours. The drop factor is 12 gtt/mL. What is the drip rate?", o: ["21 gtt/min", "25 gtt/min", "30 gtt/min", "35 gtt/min"], a: 1, t: "IV Drop Rate Calculation", e: "Drip rate = (1,000 mL × 12 gtt/mL) / (8 × 60 min) = 12,000 / 480 = 25 gtt/min." },
    { q: "A physician orders Famotidine 20 mg IV in 50 mL D5W to be infused over 15 minutes. What is the pump rate in mL/hr?", o: ["100 mL/hr", "150 mL/hr", "200 mL/hr", "250 mL/hr"], a: 2, t: "IV Piggyback Rate", e: "Rate = 50 mL ÷ (15/60 hr) = 50 ÷ 0.25 = 200 mL/hr." },
    { q: "The patient is prescribed Dexamethasone 6 mg IV. The vial is labeled 4 mg/mL. What volume should be drawn up?", o: ["1.2 mL", "1.5 mL", "1.8 mL", "2.0 mL"], a: 1, t: "Parenteral Injection", e: "Volume = 6 mg ÷ 4 mg/mL = 1.5 mL." },
    { q: "A patient with hyperkalemia is ordered 50 mL of 50% Dextrose with 10 units Regular Insulin IV over 15 minutes. What is the IV pump rate in mL/hr?", o: ["100 mL/hr", "150 mL/hr", "200 mL/hr", "300 mL/hr"], a: 2, t: "Critical Care Admin", e: "Rate = 50 mL ÷ (15/60 hr) = 50 ÷ 0.25 = 200 mL/hr." },
    { q: "The order is for Potassium Chloride 15 mEq IV. Available is KCl 2 mEq/mL. What volume should be added to the IV bag?", o: ["5.0 mL", "7.5 mL", "10.0 mL", "15.0 mL"], a: 1, t: "Electrolyte Dilution", e: "Volume = 15 mEq ÷ 2 mEq/mL = 7.5 mL." },
    { q: "A child weighing 12 kg is prescribed Ceftazidime 50 mg/kg IV every 8 hours. Available is 1 g powder. Adding 3.6 mL diluent yields 1 g in 4 mL. How many mL will the child receive per dose?", o: ["1.8 mL", "2.4 mL", "3.0 mL", "3.6 mL"], a: 1, t: "Pediatric Reconstitution", e: "1) Dose = 50 mg × 12 kg = 600 mg.\n2) Concentration = 1,000 mg / 4 mL = 250 mg/mL.\n3) Volume = 600 mg ÷ 250 mg/mL = 2.4 mL." },
    { q: "How many mL of a 1:10,000 Epinephrine solution must be administered to deliver 1 mg of Epinephrine during ACLS?", o: ["1 mL", "5 mL", "10 mL", "20 mL"], a: 2, t: "Ratio Solutions", e: "1:10,000 ratio = 1 g (1,000 mg) in 10,000 mL = 0.1 mg/mL.\nVolume for 1 mg = 1 mg ÷ 0.1 mg/mL = 10 mL." },
    { q: "The order is for Oxytocin 20 units in 1,000 mL Lactated Ringer's to be infused at 2 mU/min. What is the IV pump rate in mL/hr?", o: ["3 mL/hr", "6 mL/hr", "12 mL/hr", "18 mL/hr"], a: 1, t: "Obstetric Titration", e: "1) Concentration = 20 units = 20,000 mU in 1,000 mL = 20 mU/mL.\n2) Desired dose per hour = 2 mU/min × 60 min = 120 mU/hr.\n3) Rate = 120 mU/hr ÷ 20 mU/mL = 6 mL/hr." },
    { q: "A patient is ordered 250 mL of Packed Red Blood Cells over 4 hours. The blood administration set has a drop factor of 10 gtt/mL. What is the flow rate in gtt/min?", o: ["8 gtt/min", "10 gtt/min", "12 gtt/min", "15 gtt/min"], a: 1, t: "Blood Transfusion", e: "Flow rate = (250 mL × 10 gtt/mL) / (4 × 60 min) = 2,500 / 240 = 10.4 ≈ 10 gtt/min." },
    { q: "A physician prescribes Furosemide 80 mg IV stat. Available is Furosemide 10 mg/mL. The maximum recommended rate of direct IV push is 20 mg/min. What is the minimum time over which this dose should be pushed?", o: ["2 minutes", "4 minutes", "6 minutes", "8 minutes"], a: 1, t: "Safe IV Push Rate", e: "Minimum time = Total dose ÷ Maximum rate per minute = 80 mg ÷ 20 mg/min = 4 minutes." },
    { q: "The provider orders Cefepime 1 g in 50 mL D5W over 30 minutes. What is the infusion rate in mL/hr?", o: ["50 mL/hr", "100 mL/hr", "150 mL/hr", "200 mL/hr"], a: 1, t: "IV Piggyback Rate", e: "Rate = 50 mL ÷ (30/60 hr) = 50 ÷ 0.5 = 100 mL/hr." },
    { q: "A patient with septic shock is receiving Vasopressin at 0.04 units/min. The concentration is 40 units in 100 mL Normal Saline (0.4 units/mL). What is the pump rate in mL/hr?", o: ["4 mL/hr", "6 mL/hr", "8 mL/hr", "10 mL/hr"], a: 1, t: "Vasopressor Titration", e: "1) Dose per hr = 0.04 units/min × 60 min = 2.4 units/hr.\n2) Rate = 2.4 units/hr ÷ 0.4 units/mL = 6 mL/hr." },
    { q: "A total volume of 1,500 mL of fluid was infused over 10 hours using a set with a drop factor of 15 gtt/mL. Calculate the rate in gtt/min.", o: ["32 gtt/min", "38 gtt/min", "42 gtt/min", "48 gtt/min"], a: 1, t: "IV Drop Rate Calculation", e: "Rate = (1,500 mL × 15 gtt/mL) / (10 × 60 min) = 22,500 / 600 = 37.5 ≈ 38 gtt/min." }
];

let currentQ = 0;
let score = 0;
let answeredCount = 0;
let answersData = new Array(questions.length).fill(null);

const quizBody = document.getElementById('quiz-body');
const scoreEl = document.getElementById('score');
const qCounterEl = document.getElementById('q-counter');
const progressEl = document.getElementById('progress');

function initQuiz() {
    questions.forEach((q, index) => {
        const qDiv = document.createElement('div');
        qDiv.className = `question-container ${index === 0 ? 'active' : ''}`;
        qDiv.id = `question-${index}`;
        
        qDiv.innerHTML = `
            <div class="subject-tag">${q.t}</div>
            <div class="q-text">Q${index + 1}: ${q.q}</div>
            <div class="options" id="options-${index}">
                ${q.o.map((opt, optIndex) => `
                    <button class="option-btn" onclick="checkAnswer(${index},${optIndex}, this)">
                        ${String.fromCharCode(65 + optIndex)}.${opt}
                    </button>
                `).join('')}
            </div>
            <div class="rationale" id="rationale-${index}">
                <strong>Step-by-Step Calculation:</strong>
                ${q.e.replace(/\n/g, '<br>')}
            </div>
            <div class="navigation">
                <button class="nav-btn" onclick="changeQuestion(-1)" ${index === 0 ? 'disabled' : ''}>Previous</button>
                <button class="nav-btn" onclick="changeQuestion(1)">${index === questions.length - 1 ? 'Submit Test' : 'Next Question'}</button>
            </div>
        `;
        quizBody.appendChild(qDiv);
    });
    updateProgress();
}

function checkAnswer(qIndex, selectedOptIndex, btnElement) {
    if (answersData[qIndex] !== null) return; 
    
    const optionsContainer = document.getElementById(`options-${qIndex}`);
    const buttons = optionsContainer.querySelectorAll('.option-btn');
    const correctIndex = questions[qIndex].a;
    const rationaleBox = document.getElementById(`rationale-${qIndex}`);

    answersData[qIndex] = selectedOptIndex;
    buttons.forEach(btn => btn.classList.add('disabled'));

    if (selectedOptIndex === correctIndex) {
        btnElement.classList.add('correct');
        score += 1;
    } else {
        btnElement.classList.add('incorrect');
        buttons[correctIndex].classList.add('correct'); 
        score -= 0.3333; 
    }
    
    rationaleBox.style.display = 'block';
    answeredCount++;
    scoreEl.innerText = score.toFixed(2);
}

function changeQuestion(direction) {
    if (direction === 1 && currentQ === questions.length - 1) {
        finishExam();
        return;
    }
    
    document.getElementById(`question-${currentQ}`).classList.remove('active');
    currentQ += direction;
    document.getElementById(`question-${currentQ}`).classList.add('active');
    
    qCounterEl.innerText = `Question: ${currentQ + 1} / 100`;
    updateProgress();
    window.scrollTo(0, 0);
}

function updateProgress() {
    const percent = ((currentQ + 1) / questions.length) * 100;
    progressEl.style.width = `${percent}%`;
}

function finishExam() {
    let unattempted = questions.length - answeredCount;
    if(unattempted > 0) {
        let confirmFinish = confirm(`WARNING: You have ${unattempted} unattempted questions. Are you sure you want to submit the exam?`);
        if(!confirmFinish) return;
    }

    quizBody.style.display = 'none';
    document.querySelector('.dashboard').style.display = 'none';
    document.querySelector('.progress-bar').style.display = 'none';
    document.getElementById('results-screen').style.display = 'block';
    
    let finalScoreFormatted = score < 0 ? "0.00" : score.toFixed(2);
    document.getElementById('final-score-display').innerText = `${finalScoreFormatted} / 100`;
}

window.onload = initQuiz;
</script>

</body>
</html>
